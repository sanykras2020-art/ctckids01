<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игорь Компаниец</title>
<style>html,body{margin:0;background:#f4f1ea;font-family:Arial,sans-serif}#s{padding:24px;font-size:16px}</style>
</head>
<body><div id="s">Загрузка финальной версии…</div>
<script>
(async()=>{try{
 const u='https://raw.githubusercontent.com/sanykras2020-art/ctckids01/main/igor-site-v3/index.html?v=1';
 const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
 const h=await r.text(); document.open(); document.write(h); document.close();
}catch(e){document.getElementById('s').textContent='Не удалось загрузить сайт. Обновите страницу.';console.error(e)}})();
</script></body></html>
