name: Sync Igor site v3 assets

on:
  push:
    paths:
      - '.github/workflows/igor-site-v3-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync portrait and old-site visual archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse, unquote
          import html, json, hashlib, mimetypes, re, time

          root = Path('igor-site-v3/assets')
          old = root / 'old'
          old.mkdir(parents=True, exist_ok=True)
          for p in old.iterdir():
              if p.is_file(): p.unlink()

          UA='Mozilla/5.0 (compatible; IgorKompanietsSite/3.0)'
          MAX=15*1024*1024

          def get(url):
              req=Request(url, headers={'User-Agent':UA,'Accept':'*/*'})
              with urlopen(req, timeout=40) as r:
                  return r.read(MAX+1), r.headers.get('Content-Type','')

          portrait_url='https://raw.githubusercontent.com/sanykras2020-art/ctckids01/main/igor-site-v2/igor.webp'
          data, _=get(portrait_url)
          if len(data)<=MAX:
              (root/'igor.webp').write_bytes(data)

          site='https://igorkompaniets.tilda.ws/'
          raw, _=get(site)
          text=raw.decode('utf-8', errors='replace')
          urls=re.findall(r'(?:https?:)?//static\.tildacdn\.com/[^\s\"\'<>]+', text)
          seen=set(); rows=[]; order=0
          for source in urls:
              source=html.unescape(source).rstrip('),;')
              if source.startswith('//'): source='https:'+source
              if source in seen: continue
              seen.add(source)
              order += 1
              try:
                  payload, ctype=get(source)
              except Exception:
                  continue
              if len(payload)>MAX: continue
              path=unquote(urlparse(source).path)
              ext=Path(path).suffix.lower()
              is_img=ctype.startswith('image/') or ext in {'.jpg','.jpeg','.png','.webp','.gif','.avif','.svg'}
              if not is_img: continue
              if not ext:
                  ext=mimetypes.guess_extension(ctype.split(';')[0]) or '.bin'
              base=Path(path).name or f'asset{ext}'
              base=re.sub(r'[^A-Za-z0-9._-]+','_',base)[:100]
              name=f'{order:03d}_{base}'
              target=old/name
              target.write_bytes(payload)
              rows.append({
                  'file': f'assets/old/{name}',
                  'source_url': source,
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
                  'content_type': ctype,
                  'source': 'existing Igor Tilda site',
                  'public_use': 'reused from previous public site; final rights responsibility remains with site owner'
              })

          manifest={
              'generated_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
              'portrait':'assets/igor.webp',
              'old_site_url':site,
              'assets':rows
          }
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit synced assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add igor-site-v3/assets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync Igor v3 site assets'
          git push origin HEAD:main
